<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post a New Job</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 50px; }
        .form-container { background: white; padding: 30px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #3a6073; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #16222a; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Post a Job Vacancy</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Job Title (E.g. Python Developer)" required>
        <input type="text" name="company_name" placeholder="Company Name" required>
        <input type="text" name="location" placeholder="Location (E.g. Chennai, Remote)" required>
        <textarea name="requirements" placeholder="Requirements Keywords (E.g. Python, Django, SQL)" rows="3" required></textarea>
        <textarea name="description" placeholder="Full Job Description Details" rows="5" required></textarea>
        
        <button type="submit">Publish Job Vacancy</button>
    </form>
</div>

</body>
</html>
